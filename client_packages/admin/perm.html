<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Полномочия</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: transparent;
            color: #e8e8e8;
            overflow: hidden;
        }
        #panel {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            background: rgba(20, 25, 40, 0.94);
            border: 1px solid #3a4a6a;
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #fff;
            text-align: center;
        }
        label.lbl { display: block; margin: 8px 0 4px; font-size: 13px; color: #aab; }

        #players {
            margin: 4px 0 8px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #2a3450;
            border-radius: 4px;
            background: #10131f;
        }
        .prow {
            padding: 7px 10px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #1c2236;
        }
        .prow:hover { background: #1c2340; }
        .prow.sel { background: #2a3a6e; color: #fff; }

        #cmds {
            margin: 4px 0 12px;
            overflow-y: auto;
            flex: 1;
            max-height: 300px;
            border: 1px solid #2a3450;
            border-radius: 4px;
            padding: 8px;
            background: #10131f;
        }
        #cmds label {
            display: flex;
            align-items: center;
            padding: 4px 2px;
            cursor: pointer;
            gap: 8px;
            font-size: 14px;
        }
        #cmds label:hover { background: #1a2036; }
        #cmds input { width: 16px; height: 16px; }
        .row { display: flex; gap: 8px; }
        .btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
        }
        #btn-save { background: #2e7d32; }
        #btn-save:hover { background: #3a9441; }
        #btn-close { background: #9c3340; }
        #btn-close:hover { background: #b03a48; }
    </style>
</head>
<body>
    <div id="panel">
        <h2>Полномочия игроков</h2>

        <label class="lbl">Игрок</label>
        <div id="players"></div>

        <label class="lbl">Команды (главный админ id=1 имеет всё)</label>
        <div id="cmds"></div>

        <div class="row">
            <button id="btn-save" class="btn" type="button">Сохранить</button>
            <button id="btn-close" class="btn" type="button">Закрыть (ESC)</button>
        </div>
    </div>

    <script src="perm.js"></script>
</body>
</html>
