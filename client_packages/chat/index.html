<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }
        #chat {
            position: fixed;
            left: 1.2vw;
            top: 1.4vw;
            bottom: auto;
            width: 46vw;
            max-height: 36vh;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            user-select: none;
        }
        #messages {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 32vh;
            padding: 0.9vw 1vw 1.1vw 1vw;
            background: linear-gradient(180deg, rgba(8, 10, 16, 0.72) 0%, rgba(8, 10, 16, 0.45) 100%);
            border-left: 0.25vw solid #FF7A18;
            border-radius: 0.45vw;
            box-shadow: 0 0.4vw 1.4vw rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            scrollbar-width: thin;
        }
        #messages::-webkit-scrollbar { width: 0.3vw; }
        #messages::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); }
        #messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 0.15vw; }
        .line {
            font-size: 1.02vw;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.94);
            text-shadow: 0 0.08vw 0.25vw rgba(0, 0, 0, 0.95);
            word-break: break-word;
            animation: chatLineIn 0.16s ease;
        }
        .line .ts {
            color: rgba(255, 255, 255, 0.38);
            font-size: 0.78vw;
            margin-right: 0.5vw;
        }
        @keyframes chatLineIn {
            from { opacity: 0; transform: translateY(0.4vw); }
            to { opacity: 1; transform: none; }
        }
        #inputbar { display: none; margin-top: 0.5vw; pointer-events: auto; }
        #inputbar.open { display: block; animation: chatLineIn 0.14s ease; }
        #input {
            width: 100%;
            padding: 0.5vw 0.9vw;
            font-family: inherit;
            font-size: 1.02vw;
            color: #ffffff;
            background: rgba(8, 10, 16, 0.88);
            border: 0.08vw solid rgba(255, 255, 255, 0.12);
            border-left: 0.25vw solid #FF7A18;
            border-radius: 0.35vw;
            outline: none;
            text-shadow: 0 0.08vw 0.25vw rgba(0, 0, 0, 0.95);
        }
        #input::placeholder { color: rgba(255, 255, 255, 0.32); }
        #input:focus { border-color: rgba(255, 122, 24, 0.65); }
    </style>
</head>
<body>
    <div id="chat">
        <div id="messages"></div>
        <div id="inputbar">
            <input id="input" type="text" maxlength="255" spellcheck="false" autocomplete="off" placeholder="Сообщение... (/help — список команд)">
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var messagesEl = document.getElementById('messages');
            var inputBar = document.getElementById('inputbar');
            var input = document.getElementById('input');

            var active = true;      // чат включён (chat:activate)
            var inputOpen = false;  // строка ввода открыта
            var history = [];       // отправленные сообщения/команды
            var histIndex = -1;
            var inputCache = '';
            var lastPushText = '';
            var lastPushAt = 0;

            function pad(n) {
                n = String(n);
                return n.length < 2 ? '0' + n : n;
            }

            function ts() {
                var d = new Date();
                return '[' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ']';
            }

            // Экранируем HTML, чтобы текст игроков не ломал разметку (безопасность)
            function esc(s) {
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            // Приведение текста к HTML: экранируем ВСЁ, кроме цветовых span'ов,
            // которые RAGE:MP уже вставил в сообщение (<span style="color: 44FF44">)
            // и старых кодов !{RRGGBB}.
            function toHtml(raw) {
                var s = esc(raw);
                s = s.replace(/&lt;span style=&quot;color: ?#?([0-9a-fA-F]{6});?&quot;&gt;/g, '<span style="color:#$1">');
                s = s.replace(/&lt;\/span&gt;/g, '</span>');
                s = s.replace(/!\{([0-9a-fA-F]{6})\}/g, '</span><span style="color:#$1">');
                return s;
            }

            function atBottom() {
                return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 30;
            }

            function scrollToBottom() {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function display(text) {
                if (typeof text !== 'string' || !text.trim().length) return;
                var now = Date.now();
                // Один и тот же текст от разных интерфейсов доставки (chat:push / window.chat) — не дублируем
                if (text === lastPushText && now - lastPushAt < 300) return;
                lastPushText = text;
                lastPushAt = now;

                var follow = atBottom();
                var line = document.createElement('div');
                line.className = 'line';
                line.innerHTML = '<span class="ts">' + ts() + '</span> ' + toHtml(text);
                messagesEl.appendChild(line);
                while (messagesEl.childElementCount > 120) messagesEl.removeChild(messagesEl.firstChild);
                if (follow) scrollToBottom();
            }

            function clearLog() {
                messagesEl.innerHTML = '';
            }

            function openInput() {
                if (inputOpen || !active) return;
                inputOpen = true;
                try { mp.invoke('focus', true); } catch (e) { /* ignore */ }
                try { mp.invoke('setTypingInChatState', true); } catch (e) { /* ignore */ }
                inputBar.className = 'open';
                histIndex = -1;
                input.focus();
                try { mp.trigger('chatInput', true); } catch (e) { /* ignore */ }
            }

            function closeInput() {
                if (!inputOpen) return;
                inputOpen = false;
                try { mp.invoke('focus', false); } catch (e) { /* ignore */ }
                try { mp.invoke('setTypingInChatState', false); } catch (e) { /* ignore */ }
                inputBar.className = '';
                input.value = '';
                histIndex = -1;
                try { mp.trigger('chatInput', false); } catch (e) { /* ignore */ }
            }

            function sendInput() {
                var v = input.value.trim();
                if (v.length > 0) {
                    if (v.charAt(0) === '/') {
                        var cmd = v.slice(1);
                        if (cmd.trim().length > 0) {
                            try { mp.invoke('command', cmd); } catch (e) { /* ignore */ }
                        }
                    } else {
                        try { mp.invoke('chatMessage', v); } catch (e) { /* ignore */ }
                    }
                    history.unshift(v);
                    if (history.length > 50) history.pop();
                }
                closeInput();
            }

            document.addEventListener('keydown', function (e) {
                var key = (typeof e.keyCode === 'number') ? e.keyCode : (e.which || 0);
                switch (key) {
                    case 84: // T — открыть строку ввода (и на русской раскладке)
                        if (!inputOpen && active) {
                            openInput();
                            e.preventDefault();
                        }
                        break;
                    case 13: // Enter
                    case 108: // Numpad Enter
                        if (inputOpen) {
                            e.preventDefault();
                            sendInput();
                        }
                        break;
                    case 27: // Esc — закрыть ввод
                        if (inputOpen) {
                            e.preventDefault();
                            closeInput();
                        }
                        break;
                    case 38: // ArrowUp — к более старым сообщениям
                        if (inputOpen) {
                            e.preventDefault();
                            if (histIndex === -1) inputCache = input.value;
                            if (histIndex < history.length - 1) {
                                histIndex++;
                                input.value = history[histIndex];
                            }
                        }
                        break;
                    case 40: // ArrowDown — к более свежим
                        if (inputOpen) {
                            e.preventDefault();
                            if (histIndex === -1) break;
                            if (histIndex === 0) {
                                input.value = inputCache;
                                histIndex = -1;
                            } else {
                                histIndex--;
                                input.value = history[histIndex];
                            }
                        }
                        break;
                    case 33: // PageUp — листать историю чата
                        if (inputOpen) { e.preventDefault(); messagesEl.scrollTop -= 320; }
                        break;
                    case 34: // PageDown
                        if (inputOpen) { e.preventDefault(); messagesEl.scrollTop += 320; }
                        break;
                }
            });

            // Клик по сообщениям при открытом вводе — возвращаем фокус в строку
            messagesEl.addEventListener('mousedown', function (e) {
                if (inputOpen) {
                    e.preventDefault();
                    input.focus();
                }
            });

            var chatAPI = {
                push: display,
                clear: clearLog,
                openInput: openInput,
                closeInput: closeInput,
                activate: function (b) {
                    active = !!b;
                    if (!active && inputOpen) closeInput();
                },
                show: function (b) {
                    document.getElementById('chat').style.display = b ? '' : 'none';
                }
            };

            // Интерфейс доставки входящих сообщений от RAGE:MP (markAsChat):
            // события chat:push / chat:clear / chat:activate / chat:show
            if (typeof mp !== 'undefined') {
                mp.events.add('chat:push', display);
                mp.events.add('chat:clear', clearLog);
                mp.events.add('chat:activate', function (b) { chatAPI.activate(b); });
                mp.events.add('chat:show', function (b) { chatAPI.show(b); });
            }

            window.chatAPI = chatAPI;
            // Запасной интерфейс (если клиент вызывает методы напрямую) — дубли
            // отсекаются в display().
            if (typeof window.chat === 'undefined') window.chat = chatAPI;

            display('Multiplayer started.');
        })();
    </script>
</body>
</html>
